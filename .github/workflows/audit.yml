name: audit

# Weekly, and on every change to the lockfile: a sign-in library shouldn't
# sit on a known-vulnerable dependency between releases.
on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    paths: ["package-lock.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Only what ships to users: runtime dependencies, high and above.
      - run: npm audit --omit=dev --audit-level=high
