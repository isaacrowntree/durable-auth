name: audit

# Weekly, and on every change to the lockfile: a sign-in library shouldn't
# sit on a known-vulnerable dependency between releases.
on:
  schedule:
    - cron: "0 3 * * 1"
  push:
    paths: ["bun.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bun-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Only what ships to users: runtime dependencies, high and above.
      # Reads bun.lock directly; no install needed.
      - run: bun audit --prod --audit-level=high
