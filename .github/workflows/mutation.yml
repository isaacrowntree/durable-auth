# Mutation testing (stryker.config.mjs): minutes, not seconds, so it runs
# weekly and on demand rather than on every push.
name: mutation
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
jobs:
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
