name: publish

# Publishes to npm via OIDC trusted publishing — no NPM_TOKEN, no secret in
# this repo, and npm generates signed provenance automatically.
#
# One-time setup on npmjs.com (the package must already exist; OIDC cannot do
# a first publish, because the trusted-publisher config lives on the package's
# settings page):
#   durable-auth -> Settings -> Trusted Publisher
#     Organization or user: isaacrowntree
#     Repository:           durable-auth
#     Workflow filename:    publish.yml
#     Allowed actions:      npm publish
#
# To release: bump the version, then push a matching tag.
#   npm version patch && git push --follow-tags
#
# Two jobs, so the token that can publish never shares a job with npm ci:
# `build` runs every dev dependency (and the tests) with no id-token, and
# packs the tarball; `publish` only downloads that tarball and publishes it.
# A compromised dev dependency can break a build, not ship a release.
on:
  push:
    tags: ["v*"]
  # For re-running a release by hand — from a v* tag only (see the `if`s).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # Publishing an untested build is how a library loses trust once.
      - run: npm run typecheck
      - run: npm test
      - name: Refuse to publish a tag that disagrees with package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag != package.json $pkg"
            exit 1
          fi
      # npm pack doesn't run prepublishOnly, so build first.
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC — without it npm falls back to a token and fails
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # OIDC needs npm >= 11.5.1, and Node 22 ships npm 10.9.x — so setup-node
      # alone is not enough. Pinned: this job holds the publish token.
      - run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # No NODE_AUTH_TOKEN: the OIDC token is exchanged automatically. No
      # npm ci and no repo code: nothing runs here but npm itself.
      - run: npm publish ./*.tgz --access public
